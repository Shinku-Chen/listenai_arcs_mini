name: release-leo-radio

# LEO 网络电台固件的发版入口（瘦壳）。
#
# 真正的打包逻辑在 master 的 .github/workflows/release-firmware.yml，
# 这里只负责：什么事件算发版（打 tag）、用哪个板型 / 产物前缀 / Release 正文。
# 换新分支做别的功能固件时，复制本文件改 4 个 with 参数即可。
#
#   git tag leo-radio-v3.0.3 -m "LEO 电台 3.0.3"
#   git push origin leo-radio-v3.0.3

on:
  push:
    tags:
      - 'leo-radio-*'
  workflow_dispatch:
    inputs:
      publish:
        description: '创建/更新 GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    uses: Shinku-Chen/listenai_arcs_mini/.github/workflows/release-firmware.yml@master
    with:
      board: arcs_mini3
      app_dir: apps/arcs-mini
      build_name: leo-radio
      notes_file: .github/release-notes-leo-radio.md
      publish: ${{ github.event_name == 'push' || inputs.publish }}
