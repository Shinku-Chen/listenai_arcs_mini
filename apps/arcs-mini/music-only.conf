# 网易云音乐单应用固件配置片段
#
# 用法（合并到 prj.conf 之后，优先级更高）：
#   cmake -B <build> -S apps/arcs-mini -DBOARD=arcs_mini3 \
#         -DCONFIG_FILES=music-only.conf
#
# 这一层只做两件事：打开「单应用」开关，并关掉电台模块。
# 源码都不删：radio/ 目录留在仓库里，只是不参与编译。
# 保留 WiFi / BLE 配网 / USB adb / 显示 / 按键 / app_player / LVGL 中文点阵字库。

CONFIG_NETEASE_MUSIC=y
# 单应用：开机直达音乐播放页，按键/关机/蓝牙配网页都由音乐页自己接管
CONFIG_NETEASE_MUSIC_ONLY=y

# 电台（城市台单 + 直播流）不参与编译：它的按键分发、关机语义、配网页
# 都由上面的 NETEASE_MUSIC_ONLY 在音乐模块里等价实现。
CONFIG_RADIO=n
