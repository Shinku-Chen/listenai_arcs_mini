# 实验：把模拟器最热的 16KB 状态（VRAM + WRAM）搬进内部 SRAM。
#
# 模拟器内核（binjgb）的 Emulator 结构体约 130KB，常驻 PSRAM；实测一帧
# 70224 个 tick 要 27ms（300MHz 核约 8.1M cycles），折合每条指令 300+ cycles，
# 明显是 D-Cache 被 92KB 帧缓冲写 + ROM 取指挤爆后的访存代价，不是算得慢。
#
# 内部 SRAM 一共 168KB，静态已占 151KB，剩下的装不下 16KB。所以先把模拟器
# 固件里根本不初始化的 WiFi / BLE 驱动从编译里裁掉，腾出 SRAM 给模拟器用。
#
# 用法：-DCONFIG_FILES="arcade.conf;arcade-sram.conf"

CONFIG_WIFI=n
CONFIG_BLE=n
CONFIG_LWIP=n

# 把 binjgb 的 VRAM/WRAM（16KB）从 PSRAM 搬到内部 SRAM，
# 并在 PSRAM 里省下同样大小的 Emulator 体积。
CONFIG_ARCADE_GB_STATE_IN_SRAM=y
