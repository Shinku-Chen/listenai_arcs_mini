# 纯模拟器固件：裁掉 WiFi / BLE / LWIP，把腾出来的内部 SRAM 给模拟器热数据。
#
# 为什么要裁：模拟器（binjgb）最热的两个数组是 VRAM（16KB 双 bank）和
# WRAM（32KB 八 bank），它们原本都躺在 PSRAM 的 Emulator 结构体里。CP 核的
# D-Cache 只有 16KB（2 way x 256 set x 32B），而每帧还有 92KB 的 RGBA 帧缓冲
# 顺序写、46~103KB 的送屏缓冲写，缓存被反复冲干净，VRAM/WRAM 访问几乎每次
# 都 miss —— 这是「模拟器只有 20~27fps」的主因，不是算力不够。
#
# 内部 SRAM 一共 168KB（0x20016000 + 0x2A000），静态已占 150KB+ 装不下。
# 这个固件根本不初始化 WiFi / BLE / 语音助手（platform.c 在
# CONFIG_APPLICATION_ARCADE 下整段跳过），把驱动从编译里裁掉就能腾出来。
#
# 用法：-DCONFIG_FILES="arcade.conf;arcade-sram.conf"
#
# 注意：prj.conf 里写的是 CONFIG_WIFI_LWIP_SAME_CORE=y，那个 choice 会
# select WIFI 和 LWIP，光写 CONFIG_WIFI=n 是压不住的（select 优先于赋值），
# 必须把 choice 切到 WIFI_LWIP_NONE。

CONFIG_WIFI_LWIP_NONE=y
# CONFIG_WIFI_LWIP_SAME_CORE is not set

CONFIG_WIFI=n
CONFIG_LWIP=n
CONFIG_BLE=n

# WiFi 相关的中间层：没有 WiFi 驱动时它们只剩空壳，链接不上就一起关掉
CONFIG_LISA_NET=n
CONFIG_LISA_MODEM=n

# 把 binjgb 的 VRAM（16KB）从 PSRAM 搬到内部 SRAM，
# 并在 PSRAM 里省下同样大小的 Emulator 体积。
CONFIG_ARCADE_GB_STATE_IN_SRAM=y
