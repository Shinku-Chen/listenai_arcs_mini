# 复古模拟器（GB/GBC）专用配置片段
#
# 用法：
#   cmake -B <build> -S apps/arcs-mini -DBOARD=arcs_mini3 -DCONFIG_FILES=arcade.conf
#
# 本固件是「纯模拟器」：只要 显示 / TF 卡 / USB(adb+shell) / 按键 / 模拟器。
# WiFi、BLE 配网、语音助手全链路、云端、音频、TONE、MCP、UI 动画在
# src/system/platform.c 里按 CONFIG_APPLICATION_ARCADE 整段跳过（不初始化、
# 不起线程、不占 PSRAM）。这里再额外编译裁掉几个完全不被引用的大块。

CONFIG_APPLICATION_ARCADE=y

# 自建固件不接官方 app OTA：官方镜像会把 app 分区（0x600000）整块替换掉，
# 模拟器会被冲掉。资源包（tone/wake_word/emoji）OTA 不受影响。
CONFIG_OTA_DISABLE_APP_UPDATE=y

# 日志上传（云端抓日志）在模拟器固件里没有任何调用方：
# 关掉可以直接省掉 128KB PSRAM 静态缓冲和它的 SYS_INIT。
CONFIG_LOG_UPLOAD=n

# 16px 中文点阵字体，列表页和提示文字都用它
CONFIG_LV_FONT_SIMSUN_16_CJK=y

# 模拟器只用到一个 canvas 和几个 label，1MB LVGL 堆没必要。
# 双显存 2 x 240 x 240 x 2B 约 226KB，384KB 留足余量。
CONFIG_LVGL_HEAP_SIZE=0x60000

# Peanut-GB 是单头文件第三方实现，难免有未使用变量之类的告警，
# 这个分支不把告警当错误，避免第三方代码阻塞构建。
CONFIG_COMPILE_OPTION_WARNING_AS_ERROR=n

