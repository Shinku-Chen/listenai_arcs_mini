# 复古模拟器（GB/GBC）专用配置片段
#
# 用法：
#   cmake -B <build> -S apps/arcs-mini -DBOARD=arcs_mini3 -DCONFIG_FILES=arcade.conf
#
# 本固件是「纯模拟器」：只要 显示 / TF 卡 / USB(adb+shell) / 按键 / 模拟器。
# WiFi、BLE 配网、语音助手全链路、云端、音频、TONE、MCP、UI 动画在
# src/system/platform.c 里按 CONFIG_APPLICATION_ARCADE 整段跳过（不初始化、
# 不起线程、不占 PSRAM）。这里再额外编译裁掉几个完全不被引用的大块
# （WiFi 驱动见文件末尾，它同时是「给模拟器腾 SRAM」的主要来源）。

CONFIG_APPLICATION_ARCADE=y

# 自建固件不接官方 app OTA：官方镜像会把 app 分区（0x600000）整块替换掉，
# 模拟器会被冲掉。资源包（tone/wake_word/emoji）OTA 不受影响。
CONFIG_OTA_DISABLE_APP_UPDATE=y

# 日志上传（云端抓日志）在模拟器固件里没有任何调用方：
# 关掉可以直接省掉 128KB PSRAM 静态缓冲和它的 SYS_INIT。
CONFIG_LOG_UPLOAD=n

# 16px 中文点阵字体，列表页和提示文字都用它
CONFIG_LV_FONT_SIMSUN_16_CJK=y

# 模拟器只用到一个 canvas 和几个 label，1MB LVGL 堆没必要。
# 双显存 2 x 240 x 240 x 2B 约 226KB，384KB 留足余量。
CONFIG_LVGL_HEAP_SIZE=0x60000

# Peanut-GB 是单头文件第三方实现，难免有未使用变量之类的告警，
# 这个分支不把告警当错误，避免第三方代码阻塞构建。
CONFIG_COMPILE_OPTION_WARNING_AS_ERROR=n


# ============================================================================
# 裁掉 WiFi 驱动，把腾出来的内部 SRAM 给模拟器的热数据
# ============================================================================
#
# 为什么要裁：binjgb 最热的两个数组是 VRAM（16KB 双 bank）和 WRAM（32KB 八
# bank），原本都躺在 PSRAM 的 Emulator 结构体里。CP 核的 D-Cache 只有 16KB
# （2 way x 256 set x 32B），而每帧还有 46KB 帧缓冲顺序写、46~103KB 送屏缓冲
# 读，缓存被反复冲干净，VRAM/WRAM 访问几乎每次都 miss —— 这是「模拟器只有
# 20~27fps」的主因，不是算力不够。内部 SRAM 一共 168KB（0x20016000 + 0x2A000），
# 而 WiFi 驱动静态就吃掉约 40KB（liblmac / libumac / libumacdp / liblmacdp /
# libplf / libmodule）。这个固件根本不初始化 WiFi（src/system/platform.c 在
# CONFIG_APPLICATION_ARCADE 下整段跳过），从编译里裁掉最划算。
#
# 注意 1：prj.conf 里写的是 CONFIG_WIFI_LWIP_SAME_CORE=y，那个 choice 会
# select WIFI 和 LWIP，光写 CONFIG_WIFI=n 是压不住的（select 优先于赋值），
# 必须把 choice 切到 WIFI_LWIP_NONE。
# 注意 2：lisa_wifi.h 在没有任何 WiFi 模式宏时会直接 #error，所以
# CONFIG_LISA_WIFI 必须一起关掉：src/system/CMakeLists.txt 会把 sys_wifi.c
# 换成 sys_wifi_stub.c（永远返回「未联网」的空实现）。
# 注意 3：wifi_manager 的 arcs 设备实现（wifi_arcs.c）直接调 HAL 的 wifi_api，
# 这个符号也随之消失，arcs-sdk/modules/wifi_manager/CMakeLists.txt 里按
# CONFIG_WIFI 门控掉了，ops 返回一份全空的表。
# 注意 4：LWIP 不在这里裁 —— components/app_player 会 select 它，而且它在
# 内部 SRAM 里占得很少，不值得为它去动音频链路。
CONFIG_WIFI_LWIP_NONE=y
# CONFIG_WIFI_LWIP_SAME_CORE is not set

CONFIG_WIFI=n
CONFIG_LISA_WIFI=n

# 把 binjgb 的 VRAM（16KB，双 bank）和 WRAM（32KB，八 bank）从 PSRAM 的
# Emulator 结构体里摘出来，实体放内部 SRAM（emulator.c 里的 s_vram_data /
# s_wram_data）。Emulator 结构体因此小 48KB，PSRAM 也跟着省。
CONFIG_ARCADE_GB_STATE_IN_SRAM=y

