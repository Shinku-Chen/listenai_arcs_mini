# 「今天吃啥」单应用固件配置片段
#
# 用法（和 arcade.conf 一起合并，后者在后 = 优先级更高）：
#   cmake -B <build> -S apps/arcs-mini -DBOARD=arcs_mini3 \
#         -DCONFIG_FILES="arcade.conf;arcade-eat.conf"
#
# 这一层只打开「单应用」开关：模拟器（binjgb）、ROM 扫描/存档、小恐龙、
# 跳一跳的源码都不参与编译，开机直达「今天吃啥」。
# 其余（裁 WiFi、屏 LDO、LVGL 堆、OTA 策略）都继承 arcade.conf。

# 单应用：只保留「今天吃啥」，开机直接进它
CONFIG_ARCADE_APP_EATONLY=y

# 这个固件里没有任何中文 LVGL 文本（提示条用 5x7 点阵 ASCII 画在帧缓冲上），
# 16px 中文点阵字库（约 300KB flash）不需要，裁掉。
CONFIG_LV_FONT_SIMSUN_16_CJK=n
